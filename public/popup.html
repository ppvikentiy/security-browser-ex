<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Browser Security</title>
    <link rel="stylesheet" href="popup-ui.css" />
  </head>
  <body data-i18n-doc-title="popup_document_title">
    <div class="popup-root">
    <h1 data-i18n="popup_title">Быстрые действия</h1>

    <div class="row">
      <div class="label">
        <div class="label-title" data-i18n="popup_ext">Расширение</div>
        <div class="label-sub" data-i18n="popup_ext_sub">Все модули сразу</div>
      </div>
      <div class="toggle active" id="extensionGloballyEnabled" role="switch" aria-checked="true">
        <div class="toggle-slider"></div>
      </div>
    </div>

    <div id="sections">
      <div class="row">
        <div class="label">
          <div class="label-title" data-i18n="popup_focus">Focus Blocker</div>
          <div class="label-sub" data-i18n="popup_focus_sub">События фокуса и видимости вкладки</div>
        </div>
        <div class="toggle active" id="focusBlockingEnabled" role="switch" aria-checked="true">
          <div class="toggle-slider"></div>
        </div>
      </div>
      <div class="row">
        <div class="label">
          <div class="label-title" data-i18n="popup_sec">Анти‑фингерпринт</div>
          <div class="label-sub" data-i18n="popup_sec_sub">Подмена screen/WebGL/Canvas и др.</div>
        </div>
        <div class="toggle" id="securityEnabledPopup" role="switch" aria-checked="false">
          <div class="toggle-slider"></div>
        </div>
      </div>
      <div class="row">
        <div class="label">
          <div class="label-title" data-i18n="popup_net">Network Security</div>
          <div class="label-sub" data-i18n="popup_net_sub">Локальные адреса, WebRTC…</div>
        </div>
        <div class="toggle" id="networkSecurityEnabledPopup" role="switch" aria-checked="false">
          <div class="toggle-slider"></div>
        </div>
      </div>
    </div>

    <div class="host-line"><span data-i18n="popup_host">Текущий сайт:</span> <strong id="currentHost">—</strong></div>

    <div class="actions">
      <button type="button" id="btnPause" disabled>Временно отключить на этой вкладке</button>
      <button type="button" id="btnAddExclusion" disabled data-i18n="popup_exclude">Добавить сайт в исключения</button>
    </div>
    <div class="hint" id="statusHint"></div>

    <div class="footer">
      <a href="#" id="openOptions" data-i18n="popup_open_options">Все настройки…</a>
      <div class="footer-powered">
        Powered by
        <a href="https://github.com/ppvikentiy/security-browser-ex" target="_blank" rel="noopener noreferrer">https://github.com/ppvikentiy/security-browser-ex</a>
      </div>
    </div>

    </div>

    <script src="../src/i18n.js"></script>
    <script src="../src/popup.js"></script>
  </body>
</html>
